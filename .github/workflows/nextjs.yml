name: LandBD Next.js CI

on:
  push:
    branches:
      - feature/nextjs-migration
  pull_request:
    branches:
      - feature/nextjs-migration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
